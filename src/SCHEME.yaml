subbloque_propuesta:
  motivacion:
    titulo: This is the kind of engagement I actively look for.
    subtitulo: ''
    parrafos:
    - texto: 'This program sits squarely in the type of engagement I actively look for: a fixed-scope,
        time-boxed data-migration and integration workstream inside a larger Group ERP rollout, spanning
        two countries and requiring close governance of external technical integrators. That specific
        combination — multi-country, multi-vendor, deadline-driven, embedded in a larger regulated corporate
        program — is where delivery discipline and governance rigor matter as much as, or more than, prior
        hands-on familiarity with the specific ERP platform.'
      lede: true
    eyebrow: Motivation
    etiqueta_nav: ''
  aportaciones:
    titulo: Twenty years managing exactly this kind of delivery risk.
    elementos:
    - etiqueta: ''
      subtitulo: Data migration governance
      cuerpo: directed the technical delivery of a Credit Risk Data Warehouse migration component (~11,000
        hours), cutting the time needed to onboard data into the target platform by roughly 20% through
        a standardized feeder-migration and validation methodology across legacy (COBOL/CICS/DB2, AS/400)
        and target Data Warehouse environments.
    - etiqueta: ''
      subtitulo: Integration quality under multi-technology conditions
      cuerpo: on a three-stream integration program (mainframe Host, Java front-end, SOA/Web Services),
        raised pre-production defect detection above 85% through structured functional testing and UAT,
        protecting production from integration failures.
    - etiqueta: ''
      subtitulo: Multi-vendor / integrator governance
      cuerpo: directed a hybrid delivery ecosystem of 6 external technical factories on an 82,000-hour/year
        program, sustaining ~92% plan compliance.
    - etiqueta: ''
      subtitulo: Cross-country program coordination
      cuerpo: aligned a 17-project, ~150,000-hour international portfolio between corporate and regional
        teams, recovering 4–6 weeks of accumulated schedule delay through structured dependency management
        and replanning.
    parrafo_intro:
    - 'Over 20 years directing complex, multi-technology integration and data-migration programs for Tier-1
      banking, insurance, and telecommunications groups. I am not a Dynamics 365 Finance & Operations
      specialist, and I want to be upfront about that. What I bring instead is a proven system for managing
      exactly the risk this workstream carries:'
    nota_final:
    - PMP® and ITIL® 4 Foundation certified.
    eyebrow: What I bring
    etiqueta_nav: ''
  proyecto:
    titulo: How I'd structure governance for this workstream.
    problema:
      subtitulo: The problem
      cuerpo: 'Delivering a two-country data-migration and system-integration workstream into a new Group
        ERP platform within a fixed 18-month window, while governing one or more external technical integrators.
        The main exposure is not the ERP configuration itself — that sits with the implementation partner
        — but delivery risk on the workstream around it: data integrity loss during migration, schedule
        slippage from uncoordinated cross-country dependencies, and quality escapes from insufficient
        testing discipline ahead of cutover.'
    solucion:
      subtitulo: The proposed solution
      cuerpo: 'A standardized, previously proven data-migration and integration-governance methodology,
        not dependent on prior familiarity with the specific ERP platform: structured feeder/data validation
        design, functional testing and UAT gating before every promotion, and a vendor/integrator governance
        model that keeps external technical teams accountable to scope, data quality, and schedule. Platform-specific
        (D365 F&O) fluency is built in parallel, in direct coordination with the implementation partner''s
        functional and technical leads, without that ramp-up sitting on the program''s critical path.'
    arquitectura:
      flujo: []
      pie: ''
      imagen: ''
      puntos:
      - etiqueta: Workstreams
        descripcion: Data Migration & Quality · System Integration (legacy-to-D365 interfaces) · Testing
          & Cutover (SIT/UAT/Go-Live) · Vendor/Integrator Governance · Cross-Country Risk & Dependency
          Management (Spain/Portugal).
      - etiqueta: Cadence
        descripcion: weekly workstream sync; bi-weekly steering update; monthly cross-country stakeholder
          review.
      - etiqueta: Gates
        descripcion: migration dry-runs and mock cutovers ahead of go-live, with defect-detection thresholds
          before any promotion to production — the same discipline applied on prior multi-technology integration
          programs.
      - etiqueta: Boundary, stated explicitly
        descripcion: this architecture governs delivery, risk, and vendor accountability. It does not
          extend into the D365 F&O technical/solution architecture itself, which is outside this proposal's
          scope and outside verifiable prior experience.
      aclaracion: engagement governance — not D365 technical/solution architecture, which remains the
        implementation partner's scope
    cita: ''
